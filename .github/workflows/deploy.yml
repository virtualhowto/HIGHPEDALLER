name: Deploy Swarm
on:
  workflow_dispatch:
    inputs:
      image_sha:
        description: Full 40-character SHA from published main branch image
        required: true
        type: string
permissions:
  contents: read
  packages: read
concurrency:
  group: highpedaller-production
  cancel-in-progress: false
jobs:
  deploy:
    environment: production
    runs-on: [self-hosted, linux, swarm-manager]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Validate target, image and Swarm
        env:
          IMAGE_SHA: ${{ inputs.image_sha }}
          GAME_DOMAIN: ${{ vars.GAME_DOMAIN }}
          TRAEFIK_NETWORK: ${{ vars.TRAEFIK_NETWORK }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GAME_DOMAIN" == "highracer.virtualhowto.com" ]]
          [[ "$TRAEFIK_NETWORK" == "t3_swarm" ]]
          [[ "$(docker info --format '{{.Swarm.ControlAvailable}}')" == true ]]
          docker network inspect "$TRAEFIK_NETWORK" --format '{{.Scope}} {{.Driver}}' | grep -qx 'swarm overlay'
          git fetch origin main
          git merge-base --is-ancestor "$IMAGE_SHA" origin/main
          docker service inspect high-pedaller_high-pedaller-web >/dev/null
          # Fail instead of creating a parallel service/stack.
          if docker service inspect highpedaller_game >/dev/null 2>&1; then
            echo "Unexpected duplicate highpedaller_game service found" >&2
            exit 1
          fi
          echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
          docker pull "ghcr.io/virtualhowto/highpedaller:$IMAGE_SHA"
          echo "Preflight OK: existing stack and target image present"
      - name: Update existing stack and verify HTTP + WebSocket routing
        env:
          IMAGE_SHA: ${{ inputs.image_sha }}
          GAME_DOMAIN: ${{ vars.GAME_DOMAIN }}
          TRAEFIK_NETWORK: ${{ vars.TRAEFIK_NETWORK }}
        run: |
          set -euo pipefail
          export IMAGE="ghcr.io/virtualhowto/highpedaller:$IMAGE_SHA"
          export GAME_DOMAIN TRAEFIK_NETWORK
          docker stack config -c deploy/stack.yml >/dev/null
          # Existing service name remains high-pedaller_high-pedaller-web.
          docker stack deploy --with-registry-auth -c deploy/stack.yml high-pedaller
          for i in $(seq 1 40); do
            status="$(docker service inspect high-pedaller_high-pedaller-web --format '{{if .UpdateStatus}}{{.UpdateStatus.State}}{{else}}unknown{{end}}')"
            if [[ "$status" == "paused" || "$status" == "rollback_paused" ]]; then
              echo "Swarm rollout failed: $status" >&2
              break
            fi
            running="$(docker service ls --filter name=high-pedaller_high-pedaller-web --format '{{.Replicas}}' | head -1)"
            if [[ "$running" == "1/1" ]] && curl -fsS --max-time 8 "https://$GAME_DOMAIN/readyz" >/dev/null; then
              echo "Health check passed for $GAME_DOMAIN"
              exit 0
            fi
            sleep 5
          done
          docker service ps high-pedaller_high-pedaller-web --no-trunc || true
          docker service update --rollback high-pedaller_high-pedaller-web || true
          echo "Deployment did not become healthy; attempted rollback" >&2
          exit 1
