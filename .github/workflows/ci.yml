name: Verify
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Enforce reproducible dependency lock
        run: test -s package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run verify
      - run: npm audit --audit-level=high
      - run: docker build --pull -t high-pedaller:ci .
      - name: Container smoke test
        run: |
          set -euo pipefail
          docker run -d --name hp-ci -p 127.0.0.1:18080:8080 high-pedaller:ci
          trap 'docker logs hp-ci; docker rm -f hp-ci' EXIT
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:18080/readyz >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
  publish:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/virtualhowto/highpedaller:${{ github.sha }}
