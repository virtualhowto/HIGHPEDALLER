services:
  game:
    image: ${IMAGE:?set immutable image reference}
    networks: [edge]
    environment:
      - NODE_ENV=production
      - ALLOWED_ORIGIN=https://${GAME_DOMAIN:?set domain}
      - MAX_CONNECTIONS=100
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == worker]
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: rollback
        monitor: 45s
      rollback_config:
        parallelism: 1
        order: stop-first
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
      labels:
        - traefik.enable=true
        - traefik.docker.network=${TRAEFIK_NETWORK:?set overlay network}
        - traefik.http.routers.highpedaller.rule=Host(`${GAME_DOMAIN}`)
        - traefik.http.routers.highpedaller.entrypoints=websecure
        - traefik.http.routers.highpedaller.tls=true
        - traefik.http.services.highpedaller.loadbalancer.server.port=8080
networks:
  edge:
    external: true
    name: ${TRAEFIK_NETWORK:?set overlay network}
