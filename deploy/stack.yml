# Migration replaces the existing high-pedaller_high-pedaller-web service in place.
# Never deploy this file with a different stack name.
services:
  high-pedaller-web:
    image: ${IMAGE:?set immutable GHCR image reference}
    networks: [edge]
    environment:
      NODE_ENV: production
      PORT: "8080"
      ALLOWED_ORIGIN: https://${GAME_DOMAIN:?set domain}
      MAX_CONNECTIONS: "100"
    deploy:
      replicas: 1 # In-memory matchmaking must not be split across replicas
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: rollback
        monitor: 60s
      rollback_config:
        parallelism: 1
        order: stop-first
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
      labels:
        - traefik.enable=true
        - traefik.docker.network=${TRAEFIK_NETWORK:?set overlay network}
        - traefik.http.routers.highracer.rule=Host(`${GAME_DOMAIN}`)
        - traefik.http.routers.highracer.entrypoints=websecure
        - traefik.http.routers.highracer.tls=true
        - traefik.http.routers.highracer.service=highracer
        - traefik.http.services.highracer.loadbalancer.server.port=8080
networks:
  edge:
    external: true
    name: ${TRAEFIK_NETWORK:?set overlay network}
